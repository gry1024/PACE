# 项目包元数据；不要在注释任务中改变公开包名 /版本或依赖。
[project]
name = "pace"
version = "0.1.0"
description = "Platform-independent Personal Agent Connection Engine"
readme = "README.md"
authors = [
    { name = "gry1024", email = "2400013132@stu.pku.edu.cn" }
]
# Python下限与.python-version配合，实际环境由uv.lock锁定。
requires-python = ">=3.12"
# 优先复用现成包：只为PACE业务差异写代码，不自建协议或模型HTTP客户端。
dependencies = [
    # Alembic：显式迁移与Schema漂移检查，启动时不自动建表。
    "alembic>=1.20.0",
    # FastAPI：HTTP运维入口与ASGI生命周期，业务Tool交给MCP SDK。
    "fastapi>=0.142.2",
    # HTTP检查工具；本地连通性验证应注意环境代理。
    "httpx>=0.28.1",
    # 用户指定的官方modelcontextprotocol/python-sdk发行包，限制大版本以防API漂移。
    "mcp>=2.3.0,<3",
    # 官方SDK兼容接口；当前用于doctor，Ontology业务仍待实现。
    "openai>=3.26.0",
    # PostgreSQL驱动与池能力，不自行维护驱动协议。
    "psycopg[binary,pool]>=3.3.6",
    # 类型化环境配置、Key别名与SecretStr包装。
    "pydantic-settings>=2.15.0",
    # asyncio extra带greenlet，支持异步ORM /迁移，不用额外手写连接层。
    "sqlalchemy[asyncio]>=2.1.3",
    # 官方Jev异步SDK；PACE只组织Choice证据与淘汰赛。
    "typesafe-sdk>=0.7.2,<1",
    # ASGI服务运行器；standard包含常用运行依赖。
    "uvicorn[standard]>=0.54.0",
]

# uv_build负责打包src/pace；锁文件提交，虚拟环境不提交。
[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# 开发检查依赖与运行依赖分开，默认测试不依赖真实Key。
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

# 统一格式 /静态检查，避免注释与Review代码风格分裂。
[tool.ruff]
target-version = "py312"
line-length = 100
# 私人运行数据和研究缓存不进入常规扫描。
exclude = [".local", ".research"]

# 启用常见错误、导入顺序、版本升级和易错闭包规则。
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# pytest只收集项目tests；异步测试由pytest-asyncio自动管理。
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
