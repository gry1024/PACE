# 独立数据库 / 网络，不复用旧应用数据；秘密只从部署目录的 .env 读取。
name: pace
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pace
      POSTGRES_USER: pace
      POSTGRES_PASSWORD: ${PACE_DB_PASSWORD:?required}
    volumes:
      - pace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pace -d pace"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pace-local:latest
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 320m
  worker:
    image: pace-local:latest
    restart: unless-stopped
    env_file: ../.env
    command: ["python", "-m", "pace.interfaces.worker"]
    volumes:
      - ../.local/mail:/app/.local/mail
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
volumes:
  pace_pgdata:
