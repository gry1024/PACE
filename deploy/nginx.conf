# 复用现有证书；先 nginx -t 再 reload，保留旧配置备份。
server {
    listen 80;
    listen [::]:80;
    server_name clawcrony.com www.clawcrony.com;
    return 301 https://clawcrony.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.clawcrony.com;
    ssl_certificate /ssl/clawcrony.com.pem;
    ssl_certificate_key /ssl/clawcrony.com.key;
    return 301 https://clawcrony.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clawcrony.com;
    ssl_certificate /ssl/clawcrony.com.pem;
    ssl_certificate_key /ssl/clawcrony.com.key;
    root /var/www/pace;
    client_max_body_size 64k;
    location = / { try_files /index.html =404; }
    location = /privacy { try_files /privacy.html =404; }
    location = /terms { try_files /terms.html =404; }
    # 禁止记录 OAuth 查询参数中的授权码与私人请求。
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
